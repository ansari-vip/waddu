<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #06010a;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial Black', Impact, sans-serif;
    }

    .hint {
      color: #ff3377;
      font-size: 1.4rem;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 51, 119, 0.8);
      position: absolute;
      z-index: 10;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* Tunnel Container */
    #tunnel-wrapper {
      position: absolute;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .tunnel-ring {
      position: absolute;
      width: 0;
      height: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .neon-text {
      position: absolute;
      white-space: nowrap;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      transform-origin: center center;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #ff1a75,
        0 0 20px #ff1a75,
        0 0 40px #ff0055,
        0 0 60px #ff0055;
    }

    /* Har ring ki slow aur smooth rotation */
    .spin-cw {
      animation: rotateClockwise 25s linear infinite;
    }
    .spin-ccw {
      animation: rotateCounter 22s linear infinite;
    }

    @keyframes rotateClockwise {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes rotateCounter {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to   { transform: translate(-50%, -50%) rotate(0deg); }
    }

    /* 10 sec baad typing message */
    #final-message-box {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 90%;
      max-width: 650px;
      z-index: 20;
    }

    #typewriter-text {
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.5;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff1a75, 0 0 40px #ff0055;
      display: inline-block;
    }

    .cursor {
      display: inline-block;
      width: 4px;
      height: 2.4rem;
      background-color: #ff1a75;
      vertical-align: bottom;
      margin-left: 6px;
      box-shadow: 0 0 10px #ff1a75;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="hint" id="hint">✨ Screen par click karein ✨</div>
  
  <div id="tunnel-wrapper"></div>

  <div id="final-message-box">
    <span id="typewriter-text"></span><span class="cursor"></span>
  </div>

  <script>
    const ringConfigs = [
      { radius: 100, count: 6,  fontSize: 1.1, dir: 'spin-cw' },
      { radius: 160, count: 8,  fontSize: 1.3, dir: 'spin-ccw' },
      { radius: 230, count: 10, fontSize: 1.5, dir: 'spin-cw' },
      { radius: 310, count: 12, fontSize: 1.7, dir: 'spin-ccw' },
      { radius: 400, count: 14, fontSize: 1.9, dir: 'spin-cw' }
    ];

    const message = "I LOVE YOU ♡";
    const finalMessage = "Rizwan aap se bahut pyar karta hai ❤️";
    let isTriggered = false;

    function buildNeonTunnel() {
      const container = document.getElementById("tunnel-wrapper");

      ringConfigs.forEach(config => {
        const ring = document.createElement("div");
        ring.className = `tunnel-ring ${config.dir}`;

        for (let i = 0; i < config.count; i++) {
          const angle = (i / config.count) * (2 * Math.PI);
          const x = Math.cos(angle) * config.radius;
          const y = Math.sin(angle) * config.radius;
          const deg = (angle * 180) / Math.PI + 90;

          const span = document.createElement("span");
          span.className = "neon-text";
          span.innerText = message;
          span.style.fontSize = `${config.fontSize}rem`;
          span.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) rotate(${deg}deg)`;

          ring.appendChild(span);
        }
        container.appendChild(ring);
      });
    }

    function startExperience() {
      if (isTriggered) return;
      isTriggered = true;

      document.getElementById("hint").style.display = "none";
      const tunnel = document.getElementById("tunnel-wrapper");
      tunnel.style.opacity = "1";

      // 10 Second baad ring hatkar message aayega
      setTimeout(() => {
        tunnel.style.opacity = "0";
        setTimeout(() => {
          tunnel.remove();
          showTypewriter();
        }, 800);
      }, 10000);
    }

    function showTypewriter() {
      const box = document.getElementById("final-message-box");
      const textElem = document.getElementById("typewriter-text");
      box.style.display = "block";

      let index = 0;
      function typeChar() {
        if (index < finalMessage.length) {
          textElem.textContent += finalMessage.charAt(index);
          index++;
          setTimeout(typeChar, 90);
        }
      }
      typeChar();
    }

    buildNeonTunnel();
    window.addEventListener("pointerdown", startExperience);
  </script>
</body>
</html>
