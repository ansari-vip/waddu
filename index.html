<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle, #20052b, #05010a);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hint {
      color: #ff69b4;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
      transition: opacity 0.5s ease;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* Screen par float hone wala container (10s) */
    .float-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      animation: floatAround 10s ease-in-out forwards;
    }

    /* Gol-gol ghoomne wala ring (10s) */
    .bundle-ring {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: continuousSpin 10s linear forwards;
    }

    .text-item {
      position: absolute;
      white-space: nowrap;
      font-weight: 900;
      font-size: 2.2rem;
      color: #ff2a74;
      text-shadow: 0 0 15px #ff2a74, 0 0 30px #ff0055, 0 0 45px #ff75a0;
      transform: translate(-50%, -50%);
    }

    /* Typing message box */
    #final-message-box {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 90%;
      max-width: 600px;
    }

    #typewriter-text {
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.5;
      text-shadow: 0 0 15px #ff2a74, 0 0 25px #ff75a0;
      display: inline-block;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 2.2rem;
      background-color: #ff2a74;
      vertical-align: bottom;
      margin-left: 5px;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 10s spin animation */
    @keyframes continuousSpin {
      0% {
        transform: translate(-50%, -50%) rotate(0deg) scale(0.3);
        opacity: 0;
      }
      5% {
        transform: translate(-50%, -50%) rotate(180deg) scale(1);
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) rotate(3600deg) scale(0.2);
        opacity: 0;
      }
    }

    /* Screen par float karne ka path (10s) */
    @keyframes floatAround {
      0%   { transform: translate(-50%, -50%); }
      25%  { transform: translate(-75%, -75%); }
      50%  { transform: translate(-25%, -35%); }
      75%  { transform: translate(-75%, -35%); }
      100% { transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>

  <div class="hint" id="hint">✨ Tap anywhere on the screen ✨</div>

  <div id="final-message-box">
    <span id="typewriter-text"></span><span class="cursor"></span>
  </div>

  <script>
    const circleMessage = "I LOVE YOU ❤️";
    const totalWords = 8;
    const radius = 220;
    let isTriggered = false;

    const finalMessage = "Rizwan aap se bahut pyar karta hai ❤️";

    function startExperience() {
      if (isTriggered) return;
      isTriggered = true;

      // Tap hint ko hide karein
      document.getElementById("hint").style.opacity = "0";

      // Floating wrapper
      const floatWrap = document.createElement("div");
      floatWrap.className = "float-container";

      // Rotating Ring
      const ring = document.createElement("div");
      ring.className = "bundle-ring";

      for (let i = 0; i < totalWords; i++) {
        const angle = (i / totalWords) * (2 * Math.PI);
        const itemX = Math.cos(angle) * radius;
        const itemY = Math.sin(angle) * radius;
        const deg = (angle * 180) / Math.PI + 90;

        const span = document.createElement("span");
        span.className = "text-item";
        span.innerText = circleMessage;
        span.style.transform = `translate(${itemX}px, ${itemY}px) rotate(${deg}deg)`;

        ring.appendChild(span);
      }

      floatWrap.appendChild(ring);
      document.body.appendChild(floatWrap);

      // Thik 10 seconds (10000ms) baad circle fade hokar typing aayegi
      setTimeout(() => {
        floatWrap.remove();
        showTypewriterMessage();
      }, 10000);
    }

    function showTypewriterMessage() {
      const box = document.getElementById("final-message-box");
      const textElem = document.getElementById("typewriter-text");
      box.style.display = "block";

      let index = 0;
      function typeNextChar() {
        if (index < finalMessage.length) {
          textElem.textContent += finalMessage.charAt(index);
          index++;
          setTimeout(typeNextChar, 100);
        }
      }
      typeNextChar();
    }

    window.addEventListener("pointerdown", startExperience);
  </script>
</body>
</html>
