<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle, #1a0826, #05010a);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    .hint {
      color: #ff69b4;
      font-size: 1.2rem;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .bundle-ring {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: rotateAndFade 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    .text-item {
      position: absolute;
      white-space: nowrap;
      font-weight: 700;
      font-size: 1rem;
      color: #ff2a74;
      text-shadow: 0 0 10px #ff2a74, 0 0 20px #ff75a0;
      transform: translate(-50%, -50%);
    }

    @keyframes rotateAndFade {
      0% {
        transform: translate(-50%, -50%) rotate(0deg) scale(0.2);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg) scale(1.6);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="hint">✨ Tap anywhere on the screen ✨</div>

  <script>
    const message = "I LOVE YOU ❤️";
    const totalWords = 12; // Circle me kitni baar text repeat hoga
    const radius = 110;    // Circle ka ghera (size)

    function createCircleBundle(x, y) {
      const ring = document.createElement("div");
      ring.className = "bundle-ring";
      ring.style.left = `${x}px`;
      ring.style.top = `${y}px`;

      for (let i = 0; i < totalWords; i++) {
        const angle = (i / totalWords) * (2 * Math.PI);
        const itemX = Math.cos(angle) * radius;
        const itemY = Math.sin(angle) * radius;
        const deg = (angle * 180) / Math.PI + 90;

        const span = document.createElement("span");
        span.className = "text-item";
        span.innerText = message;
        span.style.transform = `translate(${itemX}px, ${itemY}px) rotate(${deg}deg)`;

        ring.appendChild(span);
      }

      document.body.appendChild(ring);

      setTimeout(() => {
        ring.remove();
      }, 2500);
    }

    window.addEventListener("pointerdown", (e) => {
      createCircleBundle(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
