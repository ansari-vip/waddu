<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle, #20052b, #05010a);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hint {
      color: #ff69b4;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .bundle-ring {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      /* 60s tak continuously ghoomne ke liye */
      animation: continuousSpin 60s linear forwards;
    }

    .text-item {
      position: absolute;
      white-space: nowrap;
      font-weight: 900;
      /* Bada text size */
      font-size: 2.2rem;
      color: #ff2a74;
      text-shadow: 0 0 15px #ff2a74, 0 0 30px #ff0055, 0 0 45px #ff75a0;
      transform: translate(-50%, -50%);
    }

    @keyframes continuousSpin {
      0% {
        transform: translate(-50%, -50%) rotate(0deg) scale(0.4);
        opacity: 0;
      }
      2% {
        transform: translate(-50%, -50%) rotate(72deg) scale(1);
        opacity: 1;
      }
      96% {
        opacity: 1;
      }
      100% {
        /* 60 seconds me 30 poore chakkar lagayega */
        transform: translate(-50%, -50%) rotate(10800deg) scale(1);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="hint">✨ Tap anywhere on the screen ✨</div>

  <script>
    const message = "I LOVE YOU ❤️";
    const totalWords = 8;  // Bada font hone ki wajah se 8 words perfect circle banayenge
    const radius = 220;    // Bada circle ka ghera

    function createCircleBundle(x, y) {
      const ring = document.createElement("div");
      ring.className = "bundle-ring";
      ring.style.left = `${x}px`;
      ring.style.top = `${y}px`;

      for (let i = 0; i < totalWords; i++) {
        const angle = (i / totalWords) * (2 * Math.PI);
        const itemX = Math.cos(angle) * radius;
        const itemY = Math.sin(angle) * radius;
        const deg = (angle * 180) / Math.PI + 90;

        const span = document.createElement("span");
        span.className = "text-item";
        span.innerText = message;
        span.style.transform = `translate(${itemX}px, ${itemY}px) rotate(${deg}deg)`;

        ring.appendChild(span);
      }

      document.body.appendChild(ring);

      // Pura 1 minute (60,000 ms) baad circle remove hoga
      setTimeout(() => {
        ring.remove();
      }, 60000);
    }

    window.addEventListener("pointerdown", (e) => {
      createCircleBundle(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
